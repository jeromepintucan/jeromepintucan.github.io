<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial customizer · Huawei watch faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bench:#DCDFDB;--panel:#F3F4F1;--ink:#1E2B29;--muted:#5D6A67;--line:#C9CEC9;--brass:#9C7A45}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bench);color:var(--ink);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 450px;height:100vh}
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(circle at 50% 42%,#343B39 0%,#262B2A 62%,#1A1E1D 100%);color:#DDE3E1}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.08)}
  .toolbar .grp{display:flex;gap:6px;align-items:center}
  .toolbar .lbl{color:#9FAAA7}
  .tb{background:transparent;border:1px solid rgba(255,255,255,.22);color:#DDE3E1;padding:4px 9px;border-radius:6px;font:inherit;cursor:pointer}
  .tb[aria-pressed=true]{background:#DDE3E1;color:#1E2B29;border-color:#DDE3E1}
  .toolbar label{display:flex;gap:5px;align-items:center;cursor:pointer}
  .viewport{flex:1;overflow:auto;display:grid;place-items:center;padding:30px;min-height:0}
  .case{position:relative;border-radius:50%;background:conic-gradient(from 20deg,#8C9294,#E3E6E6,#7E8486,#D2D6D6,#8C9294);
    box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.25)}
  .case.rect{border-radius:22%/19%;background:linear-gradient(135deg,#B7BCBE,#E8EBEB 30%,#8D9395 60%,#D4D8D9)}
  .screen{position:relative;border-radius:50%;overflow:hidden;background:#000}
  .case.rect .screen{border-radius:var(--cr,19%)/var(--crv,16%)}
  .screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #preview{cursor:pointer}
  #guides{pointer-events:none}
  .caption{text-align:center;color:#B9C2BF;font-size:12.5px;padding:0 0 12px}
  aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:22px 22px 60px}
  h1{font:600 25px/1.15 "EB Garamond","Iowan Old Style",Palatino,Georgia,serif;margin:0 0 4px}
  .intro{color:var(--muted);margin:0 0 12px;max-width:44ch}
  details.sec{border-top:1px solid var(--line)}
  details.sec > summary{cursor:pointer;list-style:none;padding:13px 0;font:600 17.5px "EB Garamond","Iowan Old Style",Palatino,Georgia,serif;display:flex;justify-content:space-between;align-items:center}
  details.sec > summary::after{content:"+";font:400 18px system-ui;color:var(--muted)}
  details.sec[open] > summary::after{content:"–"}
  details.sec > .body{padding:0 0 16px}
  .row{display:grid;grid-template-columns:138px 1fr;gap:10px;align-items:center;margin:7px 0}
  .row > *{min-width:0}
  .row > label{color:var(--muted);font-size:13px}
  input[type=text],input[type=number],select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;color:var(--ink)}
  input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;flex:none}
  .pair{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  input[type=range]{flex:1;min-width:0;accent-color:var(--brass)}
  .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:42px;text-align:right}
  .num{width:66px!important;flex:none;padding:3px 5px!important;font-size:12.5px!important;font-variant-numeric:tabular-nums;text-align:right}
  .unit{font-size:12px;color:var(--muted);min-width:12px}
  button{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink)}
  button.chip{padding:3px 9px;font-size:12.5px;background:#fff;color:var(--ink);border-color:var(--line)}
  .hint{font-size:12.5px;color:var(--muted);margin:6px 0}
  .sub{font:600 15px "EB Garamond",Georgia,serif;margin:14px 0 2px}
  .presets{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
  .swatch{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  .vh{position:absolute;left:-9999px}
  .picker{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:4px 0 8px}
  .picker button{background:#fff;border:1px solid var(--line);color:var(--ink);padding:5px 2px 4px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .picker button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .picker canvas{width:34px;height:34px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg button{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .seg button b{font-weight:600;font-size:13.5px}
  .seg button span{font-size:12px;color:var(--muted)}
  .seg button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
  .tabs button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:5px 12px}
  .tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  details.line{border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0;padding:0 12px}
  details.line[open]{padding-bottom:8px}
  details.line summary{cursor:pointer;padding:9px 0;font:600 15px "EB Garamond",Georgia,serif}
  details.line summary span{font:400 12.5px system-ui,sans-serif;color:var(--muted);margin-left:6px}
  .layers{list-style:none;margin:6px 0;padding:0}
  .layers li{display:grid;grid-template-columns:18px 22px 1fr 76px 92px 24px 24px;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 7px;margin:5px 0;font-size:12.5px}
  .layers li.drag{opacity:.4}
  .layers li.over{border-color:var(--brass);box-shadow:0 -2px 0 var(--brass)}
  .layers .handle{cursor:grab;color:var(--muted);text-align:center;user-select:none}
  .layers select{padding:3px 4px;font-size:12px}
  .layers input[type=range]{width:100%}
  .layers .mv{padding:0;width:24px;height:24px;background:#fff;color:var(--ink);border-color:var(--line);font-size:12px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .status{font-size:13px;color:var(--muted);min-height:1.4em;margin-top:8px}
  #result{max-width:150px;margin-top:10px;display:none}
  .file{font-size:12.5px}
  .flash{animation:flash 1.2s ease-out}
  @keyframes flash{0%{background:#E9DFC9}100%{background:transparent}}
  @media (prefers-reduced-motion:reduce){.flash{animation:none}}
  @media (max-width:980px){
    .wrap{grid-template-columns:1fr;height:auto}
    .stage{height:78vh;position:sticky;top:0;z-index:2}
    aside{border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="stage" aria-label="Preview">
    <div class="toolbar">
      <div class="grp" role="group" aria-label="Preview zoom"><span class="lbl">Zoom</span>
        <button class="tb" data-zoom="1" aria-pressed="true">100%</button>
        <button class="tb" data-zoom="2" aria-pressed="false">200%</button>
        <button class="tb" data-zoom="4" aria-pressed="false">400%</button>
        <button class="tb" data-zoom="actual" aria-pressed="false">Actual pixels</button>
      </div>
      <div class="grp"><span class="lbl">Preview</span>
        <label><input type="checkbox" data-ui="lightPrev" checked> Lighting</label>
        <label><input type="checkbox" data-ui="texPrev" checked> Texture</label>
      </div>
      <div class="grp"><span class="lbl">Guides</span>
        <label><input type="checkbox" data-ui="gCenter"> Center lines</label>
        <label><input type="checkbox" data-ui="gGrid"> Hour grid</label>
        <label><input type="checkbox" data-ui="gSafe"> Safe area</label>
      </div>
    </div>
    <div class="viewport" id="viewport">
      <div class="case" id="case"><div class="screen" id="screen">
        <canvas id="preview" width="932" height="932" aria-label="Dial preview"></canvas>
        <canvas id="guides" width="932" height="932" aria-hidden="true"></canvas>
      </div></div>
    </div>
    <div class="caption" id="caption"></div>
  </section>

  <aside id="panel">
    <h1>Dial customizer</h1>
    <p class="intro">Build the dial layer by layer, then export a background for Theme Studio. Hands and date are added there separately.</p>
    <div id="sections"></div>
  </aside>
</div>

<script>
/* =====================================================================
   Model
   ===================================================================== */
const LINES=[{id:'brand',label:'Name',open:true},{id:'sub',label:'Line under name'},{id:'bottom',label:'Lower line'},
  {id:'bottom2',label:'Second lower line'},{id:'swiss',label:'Bottom text',note:'near 6 o\'clock'}];
const GROUPS=[{id:'m12',label:'12'},{id:'m3',label:'3'},{id:'m6',label:'6'},{id:'m9',label:'9'},{id:'mo',label:'Other hours'}];
const LAYER_DEFS=[['dial','Dial surface'],['rehaut','Rehaut'],['track','Minute track'],['markers','Hour markers'],['m12','12 o\'clock marker'],
  ['emblem','Emblem'],['textTop','Name and line under'],['textLower','Lower lines'],['textBottom','Bottom text'],['center','Center detail']];
const BLENDS={normal:'source-over',multiply:'multiply',screen:'screen',overlay:'overlay',soft:'soft-light'};

const D={
  shape:'round',cornerR:80,seed:1234,transparent:'false',
  base:'#125C54',high:'#46AA96',
  material:'sunburst',texDensity:55,texFine:50,texContrast:50,texOpacity:70,texRot:0,metallic:60,grain:1.5,texCX:0,texCY:0,
  lightType:'softbox',lightAngle:320,lightWidth:55,lightSoft:65,lightInt:55,hlX:-25,hlY:-30,asym:20,specular:35,gloss:40,
  vigStr:45,vigSize:25,vigSoft:60,edgeColor:'#052A25',innerGlow:8,centerBright:35,
  rehaut:'off',rehautMat:'polished',rehautW:35,rehautDepth:40,rehautAngle:15,rehautRefl:50,rehautShadow:50,engrave:'none',engraveText:'MERIDIAN',engraveSpacing:40,
  track:'on',trackR:95.8,trackEdge:4.5,tickLen:5,tickTh:0.9,fineLen:2,fineTh:0.36,fiveLen:0,tickOpacity:100,tickSharp:85,trackRot:0,trackColor:'#ECE6D2',fineColor:'#C8CDC3',
  mMat:'polished',frame:'#C8CDD0',frameBright:50,frameThick:50,bevelSize:40,bevelSoft:50,raised:50,contact:60,reflect:45,lume:'#F2EEDC',lumeWarm:50,lumeRecess:50,
  m12Colors:'match',m12FrameC:'#D3B57E',m12LumeC:'#F2EEDC',imgMode:'original',
  logo:'none',monogram:'M',logoImg:'',logoFinish:'metal',logoColor:'#D9D9D9',logoSize:14,logoGap:3,
  font:'ebg',caps:'upper',kerning:'normal',lineSpacing:100,
  centerCap:'none',centerSize:1,centerColor:'#C8CDD0',
  impNoise:0.8,impSurface:1,impRefl:1,impTexRand:1.5,impShadow:0.8,
  swissMode:'split',swissR:86,swissGap:5
};
const GD={
  m12:{Shape:'double',Len:28.5,Width:5.7,Taper:35,Rot:0,Dist:88.5,Frame:1.3,Sharp:90,Fill:'lume',Gap:3.2,Img:''},
  m3:{Mode:'single',Shape:'triangle',Len:26.5,Width:4,Taper:0,Rot:0,Dist:88.5,Frame:1.6,Sharp:90,Fill:'lume',Gap:2.6,Img:''},
  mo:{Shape:'single',Len:20.5,Width:2.6,Taper:0,Rot:0,Dist:88.5,Frame:1.4,Sharp:90,Fill:'lume',Gap:2.6,Img:''}
};
GD.m6={...GD.m3};GD.m9={...GD.m3};
for(const g in GD) for(const k in GD[g]) D[g+k]=GD[g][k];
const LD={brand:{t:'MERIDIAN',Size:8,Weight:'600',Color:'#FFFFFF',Shadow:15},sub:{t:'AUTOMATIC',Size:4.8},bottom:{t:'200 M',Size:4.2},
  bottom2:{t:'',Size:3.6},swiss:{t:'SWISS MADE',Size:2.6,Track:150}};
for(const L of LINES){const o={Size:4,Weight:'500',Track:200,Stretch:100,Color:'#D9D9D9',Render:'ink',Ink:100,Thick:0,Soft:0.3,Shadow:10,Curve:0,X:0,Y:0,...LD[L.id]};
  D[L.id]=o.t;delete o.t;for(const k in o) D[L.id+k]=o[k];}
D.layers=LAYER_DEFS.map(([id])=>({id,visible:true,opacity:100,blend:'normal'}));

let state=JSON.parse(JSON.stringify(D));
const UI={zoom:'1',lightPrev:true,texPrev:true,gCenter:false,gGrid:false,gSafe:false,group:'m12'};

const MATERIAL_PRESETS={
  flat:{texOpacity:0,metallic:0,specular:10,gloss:20,lightType:'directional',lightInt:25,grain:0.5},
  sunburst:{texDensity:55,texFine:50,texContrast:50,texOpacity:70,metallic:60,specular:35,gloss:40,lightType:'softbox',lightInt:55,grain:1.5},
  radial:{texDensity:45,texFine:40,texContrast:45,texOpacity:60,metallic:55,specular:30,gloss:35,lightType:'softbox',lightInt:50,grain:1.2},
  satin:{texDensity:60,texFine:70,texContrast:30,texOpacity:45,metallic:35,specular:20,gloss:25,lightType:'directional',lightInt:45,grain:1.5},
  lacquer:{texOpacity:15,metallic:0,specular:75,gloss:85,lightType:'studio',lightInt:45,grain:0.3},
  matte:{texOpacity:0,metallic:0,specular:0,gloss:0,lightType:'directional',lightInt:30,grain:4},
  enamel:{texDensity:40,texFine:30,texContrast:25,texOpacity:35,metallic:0,specular:55,gloss:70,lightType:'softbox',lightInt:40,grain:0.5}
};
const SMALL=['sub','bottom','bottom2','swiss'];
const txtC=(a,b)=>{const o={brandColor:a};SMALL.forEach(k=>o[k+'Color']=b);return o};
const PRESETS=[
  {name:'Teal sunburst',swatch:'#2E8C7B',v:{base:'#125C54',high:'#46AA96',edgeColor:'#052A25',...txtC('#FFFFFF','#D9D9D9'),trackColor:'#ECE6D2',fineColor:'#C8CDC3',mMat:'polished',lume:'#F2EEDC',logoColor:'#D9D9D9'}},
  {name:'Midnight blue',swatch:'#25385E',v:{base:'#101C34',high:'#46639C',edgeColor:'#050A16',...txtC('#FFFFFF','#D9D9D9'),trackColor:'#EDEFF3',fineColor:'#AEB8CC',mMat:'whitegold'}},
  {name:'Graphite',swatch:'#4A4F52',v:{base:'#1C1F21',high:'#6E767B',edgeColor:'#08090A',...txtC('#FFFFFF','#D9D9D9'),trackColor:'#ECECE8',fineColor:'#9EA4A6',mMat:'polished'}},
  {name:'Sand and gold',swatch:'#C9AE84',v:{base:'#8A6E4E',high:'#E8D2AE',edgeColor:'#4A3722',...txtC('#2C2A26','#4A433A'),trackColor:'#2C2A26',fineColor:'#5A5148',mMat:'yellowgold',lume:'#FBF6E8',logoColor:'#D3B57E'}},
  {name:'Ice white',swatch:'#E4E8EA',v:{base:'#AEB6BA',high:'#F7F9FA',edgeColor:'#7E888D',...txtC('#1F2A30','#3E4A50'),trackColor:'#1F2A30',fineColor:'#55636A',mMat:'brushed',lume:'#FFFFFF',logoColor:'#9AA2A7'}}
];
const typeSet=(font,bw,sw,bt,st,bs,ss,ls)=>{const o={font,caps:'upper',kerning:'normal',lineSpacing:ls,brandWeight:bw,brandTrack:bt,brandSize:bs};
  SMALL.forEach(k=>{o[k+'Weight']=sw;o[k+'Track']=k==='swiss'?Math.round(st*0.75):st});o.subSize=ss;o.bottomSize=+(ss*0.88).toFixed(1);o.bottom2Size=+(ss*0.75).toFixed(1);return o};
const TYPE_PRESETS=[
  {name:'Classic luxury',v:typeSet('ebg','600','500',200,200,8,4.8,100)},
  {name:'Bold luxury',v:typeSet('ebg','700','600',220,230,8.4,4.9,100)},
  {name:'Modern',v:typeSet('sans','500','400',320,300,6.6,3.6,110)}
];
const FONTS={
  ebg:'"EB Garamond","Adobe Garamond Pro",Garamond,"Cormorant Garamond",Sabon,Baskerville,Georgia,serif',
  cormorant:'"Cormorant Garamond","EB Garamond",Garamond,Georgia,serif',
  baskerville:'"Libre Baskerville",Baskerville,"Baskerville Old Face",Georgia,serif',
  serif:'Georgia,"Times New Roman",serif',didone:'Didot,"Bodoni 72","Bodoni MT",Georgia,serif',
  sans:'"Helvetica Neue",Helvetica,Arial,sans-serif',geo:'Futura,"Century Gothic",Avenir,"Trebuchet MS",sans-serif',custom:'"UserFont",Georgia,serif'
};
const WEBFONT={ebg:'EB Garamond',cormorant:'Cormorant Garamond',baskerville:'Libre Baskerville'};
const METALS={
  polished:{c:'#D3D7DA',stops:[[0,.55],[.3,-.35],[.48,.6],[.62,-.4],[1,.25]],brushed:0},
  brushed:{c:'#B9BEC1',stops:[[0,.32],[.5,-.15],[1,.22]],brushed:1},
  whitegold:{c:'#DDD8CD',stops:[[0,.5],[.35,-.3],[.5,.5],[.7,-.3],[1,.2]],brushed:0},
  yellowgold:{c:'#CFA65A',stops:[[0,.5],[.35,-.35],[.5,.45],[.7,-.35],[1,.2]],brushed:0},
  black:{c:'#2B2E31',stops:[[0,.28],[.35,-.45],[.5,.38],[.7,-.5],[1,.12]],brushed:0}
};
const BASE=()=>state.shape==='rect'?[408,480]:[466,466];

/* =====================================================================
   Helpers
   ===================================================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex2rgb=h=>{h=(h||'#000').replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgb2hex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const tint=(hex,amt)=>{const c=hex2rgb(hex);return rgb2hex(c.map(v=>amt>=0?v+(255-v)*amt:v*(1+amt)))};
const mix=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t))};
const smooth=t=>t*t*(3-2*t);
function hashI(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296*2-1}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeGrid(seed,n){const r=rng(seed),g=new Float32Array((n+1)*(n+1));for(let i=0;i<g.length;i++)g[i]=r()*2-1;return{n,g}}
function sampleGrid(G,u,v){const n=G.n;u=clamp(u,0,0.99999)*n;v=clamp(v,0,0.99999)*n;const x0=u|0,y0=v|0,fx=smooth(u-x0),fy=smooth(v-y0),w=n+1,g=G.g;
  const a=g[y0*w+x0],b=g[y0*w+x0+1],c=g[(y0+1)*w+x0],d=g[(y0+1)*w+x0+1];return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function prep(t){return state.caps==='upper'?t.toUpperCase():t}

/* =====================================================================
   Geometry: GEO describes the current screen (circle or rounded rectangle).
   Radial positions are written for a circle of radius R; on a rectangle they are
   measured inward from the screen edge along the same ray.
   ===================================================================== */
let GEO={cx:0,cy:0,R:1,rect:false,hw:1,hh:1,cr:0,cache:new Map()};
let LV=[0,-1],LANG=-Math.PI/2;
function setGeo(W,H,scale){
  const rect=state.shape==='rect';
  GEO={cx:W/2,cy:H/2,R:Math.min(W,H)/2,rect,hw:W/2,hh:H/2,cr:rect?Math.min(state.cornerR*scale,Math.min(W,H)/2):0,cache:new Map()};
  const p=state.lightAngle*Math.PI/180;LV=[Math.sin(p),-Math.cos(p)];LANG=Math.atan2(LV[1],LV[0]);
}
function sdRR(x,y){
  if(!GEO.rect) return Math.hypot(x,y)-GEO.R;
  const qx=Math.abs(x)-GEO.hw+GEO.cr,qy=Math.abs(y)-GEO.hh+GEO.cr;
  return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-GEO.cr;
}
function edgeDist(ang){
  if(!GEO.rect) return GEO.R;
  const key=Math.round(ang*100);if(GEO.cache.has(key)) return GEO.cache.get(key);
  const t=(ang-90)*Math.PI/180,dx=Math.cos(t),dy=Math.sin(t);let lo=0,hi=Math.hypot(GEO.hw,GEO.hh)+2;
  for(let i=0;i<28;i++){const m=(lo+hi)/2;sdRR(dx*m,dy*m)>0?hi=m:lo=m}
  GEO.cache.set(key,lo);return lo;
}
function P(ang,rad){const t=(ang-90)*Math.PI/180,r=GEO.rect?edgeDist(ang)-(GEO.R-rad):rad;return[GEO.cx+r*Math.cos(t),GEO.cy+r*Math.sin(t)]}
function quad(ang,r0,r1,w0,w1){

/* =====================================================================
   Dial surface (material, texture, lighting, edge shading, imperfections)
   ===================================================================== */
const DIAL_KEYS=['shape','cornerR','seed','base','high','material','texDensity','texFine','texContrast','texOpacity','texRot','metallic','grain','texCX','texCY',
  'lightType','lightAngle','lightWidth','lightSoft','lightInt','hlX','hlY','asym','specular','gloss','vigStr','vigSize','vigSoft','edgeColor','innerGlow','centerBright',
  'impNoise','impSurface','impRefl','impTexRand'];
const dialCache=new Map();
function makeLight(){
  const w=0.15+state.lightWidth/100*1.2,soft=state.lightSoft/100,hx=state.hlX/100,hy=state.hlY/100,lx=LV[0],ly=LV[1],type=state.lightType,asym=state.asym/100;
  const fall=t=>{t=t<0?-t:t;const hard=t<0.7?1:t>1?0:1-smooth((t-0.7)/0.3);return hard+(Math.exp(-t*t*2.2)-hard)*soft};
  const hp=hx*lx+hy*ly,a2k=0.55-state.asym/250;
  return(u,v)=>{
    let band=0,diff=0;
    if(type==='directional'){const p=u*lx+v*ly;diff=clamp(p/(0.35+soft*1.4),-1,1);band=clamp((p-hp)/(w*1.2)+0.5,0,1);band*=band}
    else if(type==='radial'){band=fall(Math.hypot(u-hx,v-hy)/w);diff=band*2-0.8}
    else if(type==='studio'){const a1=fall(((u-hx-lx*0.09)*lx+(v-hy-ly*0.09)*ly)/(w*0.45))*fall(((u-hx)*-ly+(v-hy)*lx)/(w*2.2));
      const a2=fall(((u+hx*0.6+lx*0.45)*lx+(v+hy*0.6+ly*0.45)*ly)/(w*0.35))*fall((u*-ly+v*lx)/(w*2.4))*a2k;band=Math.max(a1,a2);diff=a1+a2-0.55}
    else{band=fall(((u-hx)*lx+(v-hy)*ly)/w)*fall(((u-hx)*-ly+(v-hy)*lx)/(w*2.6));diff=band*1.9-0.7}
    diff*=1+asym*(u*lx+v*ly);
    return[diff,band];
  };
}
function makeDial(W,H,scale,flags){
  const key=DIAL_KEYS.map(k=>state[k]).join('|')+`|${W}x${H}|${flags.light}|${flags.tex}`;
  if(dialCache.has(key)) return dialCache.get(key);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(W,H),d=img.data;
  const {cx,cy,R}=GEO,b=hex2rgb(state.base),h=hex2rgb(state.high),ec=hex2rgb(state.edgeColor),seed=state.seed|0;
  const gS1=makeGrid(seed+11,5),gS2=makeGrid(seed+23,13),gR=makeGrid(seed+37,9),gP=makeGrid(seed+51,42),gL=makeGrid(seed+67,7);
  const mat=state.material,tex=flags.tex&&mat!=='flat',lit=flags.light;
  const dens=state.texDensity/100,fine=state.texFine/100,contrast=state.texContrast/100,opac=state.texOpacity/100,rot=state.texRot*Math.PI/180;
  const metal=state.metallic/100,grain=state.grain/100,tcx=cx+state.texCX/100*R,tcy=cy+state.texCY/100*R;
  const spec=state.specular/100,glossExp=1+state.gloss/100*30,lint=state.lightInt/100;
  const vigS=state.vigStr/100,vigW=0.02+state.vigSize/100*0.6,vigE=0.5+(1-state.vigSoft/100)*3,glow=state.innerGlow/100,cb=state.centerBright/100;
  const nNoise=state.impNoise/100,nSurf=state.impSurface/100,nRefl=state.impRefl/100,rnd=clamp(0.3+state.impTexRand*0.12,0,1);
  const gs=Math.max(1,Math.round(scale/2)),cexp=1.6-contrast*1.2,lightShape=makeLight();
  const f1=120+dens*1200,f2=f1*(1.8+fine*1.2),f3=f1*0.37;
  const ringN=60+dens*800,lineN=80+dens*1000,cr=Math.cos(rot),sr=Math.sin(rot);
  for(let y=0;y<H;y++){
    const dy=y+0.5-cy,ty=y+0.5-tcy;
    for(let x=0;x<W;x++){
      const dx=x+0.5-cx,sd=sdRR(dx,dy);
      if(sd>1) continue;
      const e=clamp(-sd/R,0,1),rn=1-e,u=dx/R,v=dy/R;
      let T=0,aniso=0;
      if(tex){
        const tx=x+0.5-tcx,tr=Math.hypot(tx,ty);
        if(mat==='sunburst'){
          const ta=Math.atan2(ty,tx),th=ta+rot,circ=6.2832*tr,aa=k=>clamp((circ/k-2)/3,0,1);
          const s=(1-fine)*Math.sin(th*f3+1.3)*aa(f3)+fine*Math.sin(th*f2+4.1)*aa(f2)+0.6*Math.sin(th*f1+2.7)*aa(f1);
          const idx=Math.floor((th/6.2832+2)*f1),rr=hashI(idx,7,seed)*aa(f1);
          T=s*(1-rnd)*0.75+rr*rnd;aniso=Math.cos(2*(ta-LANG));
        }else if(mat==='radial'){
          const ring=tr/R*ringN,sp=R/ringN,aa=k=>clamp((sp/k-1.2)/2,0,1);
          const s=(1-fine)*Math.sin(ring*0.31*6.2832)*aa(1/0.31)+fine*Math.sin(ring*2.1*6.2832)*aa(1/2.1)+0.6*Math.sin(ring*6.2832)*aa(1);
          T=s*(1-rnd)*0.75+hashI(Math.floor(ring),3,seed)*aa(1)*rnd;aniso=-Math.cos(2*(Math.atan2(ty,tx)-LANG));
        }else if(mat==='satin'){
          const vv=(-tx*sr+ty*cr)/R*lineN,uu=(tx*cr+ty*sr)/R,sp=R/lineN,aa=clamp((sp-1.2)/2,0,1);
          const li=Math.floor(vv),hv=hashI(li,Math.floor(uu*6+hashI(li,1,seed)*3),seed);
          T=(hv*rnd+Math.sin(vv*6.2832*(1+fine))*(1-rnd)*0.6)*aa+sampleGrid(gL,(tx/R+1)/2,(vv/lineN+1)/2)*0.25;aniso=0.4*Math.cos(2*(rot+Math.PI/2-LANG));
        }else if(mat==='enamel'){T=sampleGrid(gP,x/W,y/H)*0.45}
        else if(mat==='lacquer'){T=sampleGrid(gS2,x/W,y/H)*0.35}
        T=Math.sign(T)*Math.pow(Math.abs(T),cexp)*opac;
      }
      let L=0,M=0,S=0;
      if(lit){const ls=lightShape(u,v);L=ls[0]*lint;M=metal*aniso*(0.35+0.65*lint);
        const rv=1+nRefl*12*sampleGrid(gR,x/W,y/H);
        S=spec*Math.pow(clamp(ls[1],0,1),glossExp)*rv*(aniso?0.6+0.4*Math.max(0,aniso):1);}
      const surf=nSurf*(sampleGrid(gS1,x/W,y/H)*0.7+sampleGrid(gS2,x/W,y/H)*0.3)*5;
      const shade=clamp(0.42+cb*0.3*Math.exp(-((rn/0.55)**2))+0.42*L+0.32*M+0.24*T+surf,0,1);
      let r=b[0]+(h[0]-b[0])*shade,g=b[1]+(h[1]-b[1])*shade,bl=b[2]+(h[2]-b[2])*shade;
      const s2=clamp(S,0,1);r+=(255-r)*s2;g+=(255-g)*s2;bl+=(255-bl)*s2;
      if(glow>0){const gl=glow*0.55*Math.exp(-((e/0.035)**2));r+=(h[0]-r+40)*gl;g+=(h[1]-g+40)*gl;bl+=(h[2]-bl+40)*gl}
      const vg=vigS*Math.pow(1-smooth(clamp(e/vigW,0,1)),vigE);
      r+=(ec[0]-r)*vg;g+=(ec[1]-g)*vg;bl+=(ec[2]-bl)*vg;
      const gx=(x/gs)|0,gy=(y/gs)|0,gn=grain*255*hashI(gx,gy,seed+5)*0.6;
      const mn=nNoise*255*1.2;
      r+=gn+mn*hashI(x,y,seed+101);g+=gn+mn*hashI(x,y,seed+102);bl+=gn+mn*hashI(x,y,seed+103);
      const i=(y*W+x)*4;d[i]=r;d[i+1]=g;d[i+2]=bl;d[i+3]=255*clamp(0.5-sd,0,1);
    }
  }
  ctx.putImageData(img,0,0);
  if(dialCache.size>4) dialCache.delete(dialCache.keys().next().value);
  dialCache.set(key,cv);return cv;
}

/* =====================================================================
   Rehaut and minute track
   ===================================================================== */
function drawRehaut(ctx,env){
  if(state.rehaut!=='on') return;
  const R=GEO.R,rw=R*(0.012+state.rehautW/100*0.085),inner=R-rw,ang=state.rehautAngle/30,refl=state.rehautRefl/100;
  const base={polished:'#CDD2D5',brushed:'#AEB3B6',dial:mix(state.base,state.high,0.45),black:'#1B1D1F'}[state.rehautMat];
  const la=state.lightAngle;
  const st=GEO.rect?0.4:1;
  for(let a=0;a<360;a+=st){
    const q=[P(a,R+1),P(a+st*1.05,R+1),P(a+st*1.05,inner),P(a,inner)];
    const diff=Math.cos((a-la)*Math.PI/180),sp=Math.pow(Math.max(0,diff),14)*refl+Math.pow(Math.max(0,-diff),20)*refl*0.35;
    const k=-0.25+0.5*(0.5+0.5*diff)*ang+(state.rehautMat==='brushed'?0.1*hashI(a,2,state.seed):0);
    const g=ctx.createLinearGradient(q[0][0],q[0][1],q[3][0],q[3][1]);
    g.addColorStop(0,tint(base,clamp(k-0.15+sp,-1,1)));g.addColorStop(0.55,tint(base,clamp(k+sp*0.8,-1,1)));g.addColorStop(1,tint(base,clamp(k-0.3,-1,1)));
    ctx.fillStyle=g;ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
  }
  // inner shadow cast onto the dial
  const depth=state.rehautDepth/100,sh=state.rehautShadow/100;
  if(sh>0&&depth>0){
    ctx.save();ctx.beginPath();ringPath(ctx,inner);ctx.clip();
    ctx.shadowColor=`rgba(0,0,0,${0.85*sh})`;ctx.shadowBlur=R*0.05*depth;ctx.shadowOffsetX=-LV[0]*R*0.02*depth;ctx.shadowOffsetY=-LV[1]*R*0.02*depth;
    ctx.beginPath();ctx.rect(-env.W,-env.H,env.W*3,env.H*3);ringPath(ctx,inner);ctx.fillStyle='#000';ctx.fill('evenodd');ctx.restore();
  }
  // edge line between rehaut and dial
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=R*0.003;ctx.beginPath();ringPath(ctx,inner);ctx.stroke();
  // engraving
  if(state.engrave==='custom'&&state.engraveText.trim()){
    const px=rw*0.42,mid=inner+rw*0.5,o={px,weight:'500',stretch:1,track:120};
    ctx.save();setFont(ctx,o);
    const unit=prep(state.engraveText.trim()),gapEm=0.5+state.engraveSpacing/100*4;
    const chars=[...unit],ws=chars.map(c=>ctx.measureText(c).width),ls=px*0.12;
    const unitW=ws.reduce((a,b)=>a+b,0)+ls*chars.length+gapEm*px,circ=2*Math.PI*mid*(GEO.rect?1.12:1),reps=Math.max(1,Math.floor(circ/unitW));
    const step=360/reps,cap=ctx.measureText('H').actualBoundingBoxAscent||px*0.68;
    const dark=tint(base,-0.55),light='rgba(255,255,255,.55)';
    for(let r=0;r<reps;r++){
      let a=r*step-(unitW-gapEm*px)/2/mid*180/Math.PI;
      chars.forEach((c,i)=>{const p=P(a+ws[i]/2/mid*180/Math.PI,mid),p1=P(a,mid),p2=P(a+ws[i]/mid*180/Math.PI,mid),rot=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);
        ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(rot);ctx.textAlign='center';
        ctx.fillStyle=light;ctx.fillText(c,-LV[0]*px*0.04,cap/2-LV[1]*px*0.04);ctx.fillStyle=dark;ctx.fillText(c,0,cap/2);ctx.restore();
        a+=(ws[i]+ls)/mid*180/Math.PI});
    }
    ctx.restore();
  }
}
function drawTrack(ctx){
  if(state.track!=='on') return;
  const R=GEO.R,outer=R*(1-state.trackEdge/100),rot=state.trackRot;
  ctx.save();ctx.globalAlpha=state.tickOpacity/100;
  const soft=(1-state.tickSharp/100)*R*0.006;
  if(soft>0.05){ctx.shadowBlur=soft;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0}
  const tick=(a,len,th,col)=>{if(len<=0||th<=0)return;ctx.fillStyle=col;if(soft>0.05)ctx.shadowColor=col;const q=quad(a+rot,outer-R*len/100,outer,R*th/200,R*th/200);
    ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()};
  for(let i=0;i<240;i++){if(i%4===0)continue;tick(i*1.5,state.fineLen,state.fineTh,state.fineColor)}
  for(let i=0;i<60;i++){if(i%5===0)tick(i*6,state.fiveLen,state.tickTh*1.4,state.trackColor);else tick(i*6,state.tickLen,state.tickTh,state.trackColor)}
  if(state.trackR>0){ctx.strokeStyle=state.fineColor;if(soft>0.05)ctx.shadowColor=state.fineColor;ctx.lineWidth=Math.max(0.5,R*state.fineTh/100*1.1);
    ctx.beginPath();ringPath(ctx,R*state.trackR/100);ctx.stroke()}
  ctx.restore();
}

/* =====================================================================
   Markers
   ===================================================================== */
const CROWN_PATH=new Path2D('M14 70 L19 30 L35 49 L50 16 L65 49 L81 30 L86 70 Z M13 76 H87 V89 H13 Z M50 78.5 L54.5 82.5 L50 86.5 L45.5 82.5 Z M50 46 L54 52 L50 58 L46 52 Z');
const ROMAN=['','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI','XII'];
const images={};
function setImage(key,src){if(!src){delete images[key];return}const im=new Image();im.onload=schedule;im.src=src;images[key]=im}
const gp=(g,k)=>state[g+k];
function effShape(g){if(g==='m12'||g==='mo')return gp(g,'Shape');const m=gp(g,'Mode');return m==='custom'?gp(g,'Shape'):m}
function buildMarker(g,ang,hour){
  const R=GEO.R,k=state.frameThick/50,L=R*gp(g,'Len')/100,W=R*gp(g,'Width')/100,tp=gp(g,'Taper')/100,oR=R*gp(g,'Dist')/100,top=oR-L;
  const fr=R*gp(g,'Frame')/100*k,sharp=gp(g,'Sharp')/100,gap=gp(g,'Gap'),rot=gp(g,'Rot'),shape=effShape(g),out=[];
  const poly=pts=>out.push({type:'poly',outer:pts});
  const bat=(a,w)=>poly(quad(a,top,oR,w*(1-tp),w));
  switch(shape){
    case 'single':bat(ang,W);break;
    case 'double':for(const o of[-1,1])bat(ang+o*gap,W*0.6);break;
    case 'triple':for(const o of[-1,0,1])bat(ang+o*gap*1.5,W*0.47);break;
    case 'triangle':poly([P(ang,top),...quad(ang,oR,oR,W*1.3,W*1.3).slice(1,3)]);break;
    case 'arrow':{const sh=quad(ang,oR-L*0.45,oR-L*0.45,W*1.2,W*1.2),bs=quad(ang,oR,oR,W*0.65*(1-tp*0.6),W*0.65*(1-tp*0.6));poly([P(ang,top),sh[1],bs[1],bs[2],sh[2]]);break}
    case 'diamond':{const m=quad(ang,oR-L*0.5,oR-L*0.5,W*1.05,W*1.05);poly([P(ang,top),m[1],P(ang,oR),m[2]]);break}
    case 'round':{const p=P(ang,oR-L/2);out.push({type:'circle',x:p[0],y:p[1],r:Math.min(L/2,W*1.3)});break}
    case 'square':{const h=Math.min(L/2,W*1.2);poly(quad(ang,oR-L/2-h,oR-L/2+h,h,h));break}
    case 'numeral':case 'roman':{const p=P(ang,oR-L/2);out.push({type:'text',x:p[0],y:p[1],txt:shape==='roman'?ROMAN[hour]:String(hour),px:L*(shape==='roman'&&hour%12!==0&&ROMAN[hour].length>2?0.62:0.8)});break}
    case 'crown':{const p=P(ang,oR-L/2),h=L*0.78;out.push({type:'crown',x:p[0],y:p[1],w:Math.max(h*0.9,W*3.6),h});break}
    case 'image':{const p=P(ang,oR-L/2),im=images[g],ar=im&&im.naturalWidth?im.naturalWidth/im.naturalHeight:1,h=L*0.9;out.push({type:'image',x:p[0],y:p[1],w:Math.max(h*ar*(W/(R*0.034)),1),h,img:g});break}
  }
  const c=P(ang,oR-L/2);
  out.forEach(m=>{
    m.g=g;m.rot=rot;m.rnd=hashI(hour,ang|0,state.seed+9);
    if(m.type==='poly'){
      m.outer=rotatePts(m.outer,c[0],c[1],rot);
      let me=1e9;m.outer.forEach((p,i)=>{const q=m.outer[(i+1)%m.outer.length];me=Math.min(me,Math.hypot(q[0]-p[0],q[1]-p[1]))});
      m.cr=(1-sharp)*me*0.5;m.inner=offsetConvex(m.outer,fr);m.icr=Math.max(0,m.cr-fr);
      m.oPath=roundPoly(m.outer,m.cr);m.iPath=roundPoly(m.inner,m.icr);
    }else if(m.type==='circle'){m.ri=Math.max(0,m.r-fr);m.oPath=new Path2D();m.oPath.arc(m.x,m.y,m.r,0,Math.PI*2);m.iPath=new Path2D();m.iPath.arc(m.x,m.y,m.ri,0,Math.PI*2)}
    else if(m.type==='crown'){const t=new DOMMatrix().translate(m.x,m.y).rotate(rot).translate(-m.w/2,-m.h/2-m.h*0.025).scale(m.w/74,m.h/73).translate(-13,-16);
      m.oPath=new Path2D();m.oPath.addPath(CROWN_PATH,t);m.fill='evenodd'}
  });
  return out;
}
function allMarkers(){
  const res={markers:[],m12:[]};
  for(let hr=1;hr<=12;hr++){const ang=(hr*30)%360,g=hr===12?'m12':hr===3?'m3':hr===6?'m6':hr===9?'m9':'mo';
    const list=buildMarker(g,ang,hr);(g==='m12'?res.m12:res.markers).push(...list)}
  return res;
}
function ptsOf(m,which){
  if(m.type==='circle'){const r=which==='outer'?m.r:m.ri,pts=[];for(let i=0;i<48;i++){const t=i/48*Math.PI*2;pts.push([m.x+r*Math.cos(t),m.y+r*Math.sin(t)])}return pts}
  return m[which];
}

    ctx.strokeStyle=g;ctx.lineWidth=R*0.008*k;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}

   Render pipeline (layers, opacity, blend modes)
   ===================================================================== */
function render(W,H,scale,flags={light:true,tex:true}){
  setGeo(W,H,scale);
  const out=document.createElement('canvas');out.width=W;out.height=H;const octx=out.getContext('2d');
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const t=tmp.getContext('2d');
  const env={W,H,scale};const R=GEO.R,{cx,cy,hh}=GEO;
  const mk=allMarkers();
  // text layout
  const sp=state.lineSpacing/100,oN=lineStyle('brand'),oS=lineStyle('sub'),oB=lineStyle('bottom'),oB2=lineStyle('bottom2'),oW=lineStyle('swiss');
  const nameY=cy-hh*0.36+R*state.brandY/100;
  t.save();const nameCap=state.brand?setFont(t,oN):oN.px*0.68;t.restore();
  const lay={};
  if(state.brand) lay.brand=layoutLine(t,prep(state.brand),cx+R*state.brandX/100,nameY,oN);
  if(state.sub) lay.sub=layoutLine(t,prep(state.sub),cx+R*state.subX/100,nameY+sp*(oN.px+oS.px)*0.75+R*state.subY/100,oS);
  const lowY=cy+hh*0.34+R*state.bottomY/100;
  if(state.bottom) lay.bottom=layoutLine(t,prep(state.bottom),cx+R*state.bottomX/100,lowY,oB);
  if(state.bottom2) lay.bottom2=layoutLine(t,prep(state.bottom2),cx+R*state.bottom2X/100,lowY+sp*(oB.px+oB2.px)*0.75+R*state.bottom2Y/100,oB2);
  if(state.swiss) lay.swiss=state.swissMode==='straight'?layoutLine(t,prep(state.swiss),cx+R*state.swissX/100,P(180,R*state.swissR/100)[1],oW):layoutArc(t,prep(state.swiss),oW);
  const ls=R*state.logoSize/100;
  const L={
    dial:c=>c.drawImage(makeDial(W,H,scale,flags),0,0),
    rehaut:c=>drawRehaut(c,env),
    track:c=>drawTrack(c),
    markers:c=>paintMarkers(c,mk.markers),
    m12:c=>paintMarkers(c,mk.m12),
    emblem:c=>drawEmblem(c,cx+R*state.brandX/100,nameY-nameCap/2-R*state.logoGap/100-ls/2,ls,R),
    textTop:c=>{lay.brand&&paintText(c,lay.brand);lay.sub&&paintText(c,lay.sub)},
    textLower:c=>{lay.bottom&&paintText(c,lay.bottom);lay.bottom2&&paintText(c,lay.bottom2)},
    textBottom:c=>{lay.swiss&&paintText(c,lay.swiss)},
    center:c=>drawCenter(c)
  };
  state.layers.forEach(ly=>{
    if(!ly.visible||!L[ly.id]) return;
    t.setTransform(1,0,0,1,0,0);t.clearRect(0,0,W,H);
    t.save();if(ly.id!=='dial'){screenPath(t);t.clip()}L[ly.id](t);t.restore();
    octx.globalAlpha=ly.opacity/100;octx.globalCompositeOperation=BLENDS[ly.blend]||'source-over';octx.drawImage(tmp,0,0);
  });
  octx.globalAlpha=1;
  // keep everything inside the screen, then add black outside unless transparent
  octx.globalCompositeOperation='destination-in';octx.fillStyle='#000';screenPath(octx);octx.fill();
  octx.globalCompositeOperation='destination-over';
  if(state.transparent!=='true'){octx.fillStyle='#000';octx.fillRect(0,0,W,H)}
  octx.globalCompositeOperation='source-over';
  return out;
}
function renderFor(scale){
  const [bw,bh]=BASE(),ss=Math.max(scale,4);let src=render(bw*ss,bh*ss,ss);
  while(src.width/2>=bw*scale-0.5){const h=document.createElement('canvas');h.width=src.width/2;h.height=src.height/2;
    const hc=h.getContext('2d');hc.imageSmoothingQuality='high';hc.drawImage(src,0,0,h.width,h.height);src=h}
  return src;
}

PRESETS.forEach(p=>{const b=document.createElement('button');b.className='swatch';b.type='button';b.style.background=p.swatch;b.title=p.name;b.innerHTML=`<span class="vh">${p.name}</span>`;
  b.onclick=()=>{Object.assign(state,p.v);syncInputs();schedule()};$('presets').appendChild(b)});
TYPE_PRESETS.forEach(p=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=p.name;b.onclick=()=>{Object.assign(state,p.v);syncInputs();ensureFont();schedule()};$('typePresets').appendChild(b)});

// pickers (12 o'clock shapes and emblems)
const TW=[['double','Twin'],['crown','Crown'],['single','Wide'],['triple','Triple'],['triangle','Triangle'],['arrow','Arrow'],['diamond','Diamond'],['round','Round'],['square','Square'],['numeral','12'],['roman','XII'],['image','Upload'],['none','None']];
const twThumbs={},logoThumbs={};
TW.forEach(([k,label])=>{const b=document.createElement('button');b.type='button';b.dataset.tw=k;const cv=document.createElement('canvas');cv.width=cv.height=68;twThumbs[k]=cv;
  b.append(cv,document.createTextNode(label));b.onclick=()=>{state.m12Shape=k;syncInputs();schedule()};$('twPicker').appendChild(b)});
Object.entries(LOGOS).forEach(([k,L])=>{const b=document.createElement('button');b.type='button';b.dataset.logo=k;const cv=document.createElement('canvas');cv.width=cv.height=68;logoThumbs[k]=cv;
  b.append(cv,document.createTextNode(L.label));b.onclick=()=>{state.logo=k;syncInputs();schedule()};$('logoPicker').appendChild(b)});
function noneIcon(ctx){ctx.strokeStyle='#9AA3A0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(34,34,21,0,Math.PI*2);ctx.moveTo(19,49);ctx.lineTo(49,19);ctx.stroke()}
function drawThumbs(){
  const saveGeo=GEO,saveLV=LV,saved={...state};
  Object.entries(twThumbs).forEach(([k,cv])=>{const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,68,68);if(k==='none')return noneIcon(ctx);
    GEO={cx:500,cy:500,R:500,rect:false,hw:500,hh:500,cr:0,cache:new Map()};LV=[0,-1];state.m12Rot=0;state.m12Shape=k;
    const list=buildMarker('m12',0,12);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    list.forEach(m=>{const pts=m.type==='poly'?m.outer:m.type==='circle'?[[m.x-m.r,m.y-m.r],[m.x+m.r,m.y+m.r]]:m.type==='text'?[[m.x-m.px*0.8,m.y-m.px*0.4],[m.x+m.px*0.8,m.y+m.px*0.4]]:[[m.x-m.w/2,m.y-m.h/2],[m.x+m.w/2,m.y+m.h/2]];
      pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])})});
    const sc=54/Math.max(x1-x0,y1-y0);ctx.setTransform(sc,0,0,sc,34-sc*(x0+x1)/2,34-sc*(y0+y1)/2);
    list.forEach(m=>{fillShape(ctx,m,'#5E6764');if(m.iPath){ctx.fillStyle='#ECE9DE';ctx.fill(m.iPath)}});
    Object.assign(state,saved);});
  GEO=saveGeo;LV=saveLV;
  Object.entries(logoThumbs).forEach(([k,cv])=>{const ctx=cv.getContext('2d');ctx.clearRect(0,0,68,68);if(k==='none')return noneIcon(ctx);
    const sv=[state.logo,state.logoColor,state.logoFinish];state.logo=k;state.logoColor='#1E2B29';state.logoFinish='flat';drawEmblem(ctx,34,34,56,34,{thumb:true});[state.logo,state.logoColor,state.logoFinish]=sv});
}
function updatePickers(){
  document.querySelectorAll('[data-tw]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tw===state.m12Shape)));
  document.querySelectorAll('[data-logo]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.logo===state.logo)));
}

// layers list with drag and drop
function renderLayers(){
  const ul=$('layers');ul.innerHTML='';
  const names=Object.fromEntries(LAYER_DEFS);
  [...state.layers].reverse().forEach(ly=>{
    const li=document.createElement('li');li.draggable=true;li.dataset.id=ly.id;
    li.innerHTML=`<span class="handle" aria-hidden="true">⋮⋮</span><input type="checkbox" ${ly.visible?'checked':''} aria-label="Show ${names[ly.id]}"><span>${names[ly.id]}</span>
      <input type="range" min="0" max="100" value="${ly.opacity}" aria-label="${names[ly.id]} opacity">
      <select aria-label="${names[ly.id]} blend mode">${[['normal','Normal'],['multiply','Multiply'],['screen','Screen'],['overlay','Overlay'],['soft','Soft light']].map(([v,n])=>`<option value="${v}" ${ly.blend===v?'selected':''}>${n}</option>`).join('')}</select>
      <button type="button" class="mv" aria-label="Move ${names[ly.id]} up">↑</button><button type="button" class="mv" aria-label="Move ${names[ly.id]} down">↓</button>`;
    const [cb,rng,sel]=[li.querySelector('input[type=checkbox]'),li.querySelector('input[type=range]'),li.querySelector('select')];
    cb.onchange=()=>{ly.visible=cb.checked;schedule()};rng.oninput=()=>{ly.opacity=+rng.value;scheduleFast()};sel.onchange=()=>{ly.blend=sel.value;schedule()};
    const [up,dn]=li.querySelectorAll('.mv');
    up.onclick=()=>moveLayer(ly.id,1);dn.onclick=()=>moveLayer(ly.id,-1);
    li.addEventListener('dragstart',e=>{li.classList.add('drag');e.dataTransfer.setData('text/plain',ly.id);e.dataTransfer.effectAllowed='move'});
    li.addEventListener('dragend',()=>li.classList.remove('drag'));
    li.addEventListener('dragover',e=>{e.preventDefault();li.classList.add('over')});
    li.addEventListener('dragleave',()=>li.classList.remove('over'));
    li.addEventListener('drop',e=>{e.preventDefault();li.classList.remove('over');const from=e.dataTransfer.getData('text/plain');if(from&&from!==ly.id)dropLayer(from,ly.id)});
    ul.appendChild(li);
  });
}
function moveLayer(id,dir){const i=state.layers.findIndex(l=>l.id===id),j=i+dir;if(j<0||j>=state.layers.length)return;
  const a=state.layers;[a[i],a[j]]=[a[j],a[i]];renderLayers();schedule()}
function dropLayer(from,to){const a=state.layers,i=a.findIndex(l=>l.id===from),item=a.splice(i,1)[0],j=a.findIndex(l=>l.id===to);a.splice(j+1,0,item);renderLayers();schedule()}

// files
function readFile(input,cb){input.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result,f.name);r.readAsDataURL(f)})}
GROUPS.forEach(g=>readFile($('file_'+g.id),(src,name)=>{state[g.id+'Img']=src;setImage(g.id,src);status.textContent=`Marker image loaded from ${name}.`;schedule()}));
readFile($('logoFile'),(src,name)=>{state.logoImg=src;state.logo='custom';setImage('logo',src);syncInputs();status.textContent=`Emblem loaded from ${name}.`;schedule()});
$('fontFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{const face=new FontFace('UserFont',await f.arrayBuffer());await face.load();document.fonts.add(face);state.font='custom';syncInputs();schedule();status.textContent=`Using ${f.name}.`}
  catch{status.textContent='That font file could not be read. Try a .ttf, .otf or .woff file.'}});
async function ensureFont(){
  const fam=WEBFONT[state.font];if(!fam){schedule();return}
  try{const ws=[...new Set(LINES.map(L=>state[L.id+'Weight']))];await Promise.all(ws.map(w=>document.fonts.load(`${w} 40px "${fam}"`)));
    const ok=[...document.fonts].some(f=>f.family.replace(/["']/g,'')===fam&&f.status==='loaded');
    $('fontNote').textContent=ok?'Tracking is in thousandths of an em, the same unit as design apps (+200 = wide luxury spacing).':`${fam} couldn't be downloaded here, so a similar serif is shown. Open the file in a regular browser while online, or upload the font file.`}catch(e){}
  schedule();
}
document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',schedule);
function restoreImages(){GROUPS.forEach(g=>setImage(g.id,state[g.id+'Img']));setImage('logo',state.logoImg)}

/* =====================================================================
   Preview, zoom and guides
   ===================================================================== */
const pv=$('preview'),pctx=pv.getContext('2d'),gv=$('guides'),gctx=gv.getContext('2d');
let raf=0,pScale=2;
let fullTimer=0;
function schedule(){cancelAnimationFrame(raf);clearTimeout(fullTimer);raf=requestAnimationFrame(()=>drawPreview(false))}
// while dragging a slider, draw a quick 1× preview, then the sharp one once the slider rests
function scheduleFast(){cancelAnimationFrame(raf);clearTimeout(fullTimer);raf=requestAnimationFrame(()=>drawPreview(true));fullTimer=setTimeout(schedule,260)}
function layoutStage(){
  const [bw,bh]=BASE(),vp=$('viewport'),cs=$('case'),scr=$('screen'),dpr=window.devicePixelRatio||1;
  const availW=vp.clientWidth-60,availH=vp.clientHeight-60,fit=Math.max(120,Math.min(availW/(bw*1.1),availH/(bh*1.1))*bw);
  const dispW=UI.zoom==='actual'?bw/dpr:fit*(+UI.zoom),dispH=dispW*bh/bw,pad=dispW*(state.shape==='rect'?0.06:0.034);
  scr.style.width=dispW+'px';scr.style.height=dispH+'px';cs.style.padding=pad+'px';
  pScale=UI.zoom==='actual'?1:clamp(Math.ceil(dispW*dpr/bw),1,4);
  const W=bw*pScale,H=bh*pScale;
  if(pv.width!==W||pv.height!==H){pv.width=gv.width=W;pv.height=gv.height=H}
  pv.style.imageRendering=UI.zoom==='actual'?'pixelated':'auto';
}
function applyShape(){
  const [bw,bh]=BASE(),cs=$('case');
  cs.classList.toggle('rect',state.shape==='rect');
  if(state.shape==='rect'){cs.style.setProperty('--cr',(state.cornerR/bw*100)+'%');cs.style.setProperty('--crv',(state.cornerR/bh*100)+'%')}
  $('caption').textContent=state.shape==='rect'?'43.2 × 36.3 × 9.9 mm · Huawei Watch Fit 3 · 1.82″ · 408 × 480 px':'Huawei Watch GT 7 Pro · 1.47″ · 466 × 466 px';
  document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===state.shape)));
  [...$('size').options].forEach(o=>{const k=+o.value;o.textContent=`${bw*k} × ${bh*k}`+(k===1?' (Theme Studio)':k===8?' (master)':'')});
  layoutStage();
}
function drawGuides(){
  const W=gv.width,H=gv.height;gctx.clearRect(0,0,W,H);if(!UI.gCenter&&!UI.gGrid&&!UI.gSafe)return;
  setGeo(W,H,pScale);const R=GEO.R;gctx.lineWidth=Math.max(1,pScale*0.6);
  if(UI.gCenter){gctx.strokeStyle='rgba(255,80,80,.85)';gctx.setLineDash([]);gctx.beginPath();gctx.moveTo(W/2,0);gctx.lineTo(W/2,H);gctx.moveTo(0,H/2);gctx.lineTo(W,H/2);gctx.stroke()}
  if(UI.gGrid){gctx.strokeStyle='rgba(80,200,255,.8)';gctx.setLineDash([4*pScale,3*pScale]);for(let h=0;h<12;h++){const p=P(h*30,R);gctx.beginPath();gctx.moveTo(GEO.cx,GEO.cy);gctx.lineTo(p[0],p[1]);gctx.stroke()}}
  if(UI.gSafe){gctx.strokeStyle='rgba(255,220,90,.9)';gctx.setLineDash([6*pScale,4*pScale]);gctx.beginPath();ringPath(gctx,R*0.9);gctx.stroke();
    gctx.setLineDash([]);gctx.fillStyle='rgba(255,220,90,.95)';gctx.font=`${11*pScale}px system-ui`;gctx.textAlign='center';gctx.fillText('safe area',GEO.cx,P(0,R*0.9)[1]+14*pScale)}
  gctx.setLineDash([]);
}
function drawPreview(fast){
  layoutStage();
  const [bw,bh]=BASE(),quick=fast&&pScale>1;
  const img=quick?render(bw,bh,1,{light:UI.lightPrev,tex:UI.texPrev}):render(pv.width,pv.height,pScale,{light:UI.lightPrev,tex:UI.texPrev});
  pctx.clearRect(0,0,pv.width,pv.height);pctx.imageSmoothingQuality='high';pctx.drawImage(img,0,0,pv.width,pv.height);
  drawGuides();drawThumbs();
}
document.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{UI.zoom=b.dataset.zoom;document.querySelectorAll('[data-zoom]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));schedule()}));
document.querySelectorAll('[data-ui]').forEach(cb=>cb.addEventListener('change',()=>{UI[cb.dataset.ui]=cb.checked;schedule()}));
window.addEventListener('resize',schedule);
pv.addEventListener('click',e=>{
  const r=pv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1,d=Math.hypot(x,y);if(d<0.45)return;
  const ang=(Math.atan2(x,-y)*180/Math.PI+360)%360,h=Math.round(ang/30)%12,g=h===0?'m12':h===3?'m3':h===6?'m6':h===9?'m9':'mo';
  UI.group=g;syncInputs();const s=$('markersSec');s.open=true;s.scrollIntoView({behavior:'smooth',block:'start'});s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash');
});

/* =====================================================================
   Export, save, load
   ===================================================================== */
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
$('exportBtn').onclick=()=>{
  const scale=parseInt($('size').value),[bw,bh]=BASE();
  status.textContent=scale>=4?'Rendering… large sizes take several seconds.':'Rendering…';
  setTimeout(()=>{renderFor(scale).toBlob(blob=>{
    const name=`${(state.brand||'dial').toLowerCase().replace(/[^a-z0-9]+/g,'-')}_${state.shape==='rect'?'fit3':'gt7pro'}_${bw*scale}x${bh*scale}.png`;
    download(blob,name);const img=$('result');img.src=URL.createObjectURL(blob);img.style.display='block';$('resultHint').hidden=false;status.textContent=`Exported ${name}.`},'image/png')},40);
};
$('saveBtn').onclick=()=>{download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'dial_settings.json');status.textContent='Settings saved as dial_settings.json.'};
$('loadBtn').onclick=()=>$('loadFile').click();
$('loadFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{const data=JSON.parse(await f.text());state={...JSON.parse(JSON.stringify(D)),...data};
    if(!Array.isArray(state.layers)||state.layers.length!==LAYER_DEFS.length)state.layers=JSON.parse(JSON.stringify(D.layers));
    restoreImages();syncInputs();ensureFont();schedule();status.textContent=`Loaded ${f.name}.`}
  catch{status.textContent='That file is not a valid settings file.'}});
$('resetBtn').onclick=()=>{state=JSON.parse(JSON.stringify(D));restoreImages();syncInputs();ensureFont();schedule();status.textContent='Reset to the original design.'};

syncInputs();drawPreview();ensureFont();
</script>
